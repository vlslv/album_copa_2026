<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Copa 2026 - Dashboard</title>
    <style>
        :root { --primary: #8a1538; --secondary: #eeeee4; --accent: #007a5e; --legend: #b8860b; --mcd: #ffbc0d; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        
        .header { position: sticky; top: 0; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 1000; display: flex; justify-content: space-around; align-items: center; margin-bottom: 25px; }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 1.4em; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.8em; color: #666; text-transform: uppercase; }

        .group-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .team-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .team-name { font-weight: bold; color: var(--primary); border-bottom: 2px solid var(--secondary); margin-bottom: 10px; display: flex; justify-content: space-between; }
        
        .sticker-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 5px; }
        .sticker { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; font-size: 0.7em; transition: 0.1s; }
        .sticker.checked { background: var(--accent) !important; color: white; border-color: var(--accent); }
        
        .special-section { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .mcd { border-top: 5px solid var(--mcd); }
        .lgd { border-top: 5px solid var(--legend); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="stat-item"><span class="stat-value" id="total">0/1108</span><span class="stat-label">Total</span></div>
        <div class="stat-item"><span class="stat-value" id="percent">0%</span><span class="stat-label">Progresso</span></div>
        <button onclick="resetAlbum()" style="background:#ff4444; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Limpar Tudo</button>
    </div>

    <div class="group-container" id="content"></div>
</div>

<script>
    const timesPorGrupo = {
        "GRUPO A": ["México", "África do Sul", "Coreia do Sul", "Tchéquia"],
        "GRUPO B": ["Canadá", "Bósnia e Herz.", "Catar", "Suíça"],
        "GRUPO C": ["Brasil", "Marrocos", "Haiti", "Escócia"],
        "GRUPO D": ["EUA", "Paraguai", "Austrália", "Turquia"],
        "GRUPO E": ["Alemanha", "Curaçau", "Costa do Marfim", "Equador"],
        "GRUPO F": ["Holanda", "Japão", "Suécia", "Tunísia"],
        "GRUPO G": ["Bélgica", "Egito", "Irã", "Nova Zelândia"],
        "GRUPO H": ["Espanha", "Cabo Verde", "Arábia Saudita", "Uruguai"],
        "GRUPO I": ["França", "Senegal", "Iraque", "Noruega"],
        "GRUPO J": ["Argentina", "Argélia", "Áustria", "Jordânia"],
        "GRUPO K": ["Portugal", "RD Congo", "Uzbequistão", "Colômbia"],
        "GRUPO L": ["Inglaterra", "Croácia", "Gana", "Panamá"]
    };

    let album = JSON.parse(localStorage.getItem('album2026_v2')) || {};

    function render() {
        const container = document.getElementById('content');
        container.innerHTML = '';
        let count = 0;

        Object.keys(timesPorGrupo).forEach(grupo => {
            timesPorGrupo[grupo].forEach(time => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `<div class="team-name"><span>${time}</span><small style="color:#999">${grupo}</small></div>`;
                
                const grid = document.createElement('div');
                grid.className = 'sticker-grid';
                
                for(let i=1; i<=22; i++) {
                    const id = `${time}-${i}`;
                    const div = document.createElement('div');
                    div.className = `sticker ${album[id] ? 'checked' : ''}`;
                    div.innerText = i;
                    div.onclick = () => toggle(id);
                    if(album[id]) count++;
                    grid.appendChild(div);
                }
                card.appendChild(grid);
                container.appendChild(card);
            });
        });

        // Especiais
        renderSpecials(container, "McDonald's", "MCD", 12, "mcd");
        renderSpecials(container, "Legends", "LGD", 40, "lgd");

        const totalGeral = 1108; // (48*22) + 12 + 40
        document.getElementById('total').innerText = `${count}/${totalGeral}`;
        document.getElementById('percent').innerText = Math.round((count/totalGeral)*100) + '%';
    }

    function renderSpecials(container, nome, prefixo, qtd, classe) {
        const card = document.createElement('div');
        card.className = `team-card ${classe}`;
        card.innerHTML = `<div class="team-name">${nome}</div>`;
        const grid = document.createElement('div');
        grid.className = 'sticker-grid';
        for(let i=1; i<=qtd; i++) {
            const id = `${prefixo}-${i}`;
            const div = document.createElement('div');
            div.className = `sticker ${album[id] ? 'checked' : ''}`;
            div.innerText = i;
            div.onclick = () => toggle(id);
            grid.appendChild(div);
        }
        card.appendChild(grid);
        container.appendChild(card);
    }

    function toggle(id) {
        album[id] = !album[id];
        localStorage.setItem('album2026_v2', JSON.stringify(album));
        render();
    }

    function resetAlbum() {
        if(confirm("Deseja zerar sua coleção?")) {
            album = {};
            localStorage.removeItem('album2026_v2');
            render();
        }
    }

    render();
</script>
</body>
</html>
