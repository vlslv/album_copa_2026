<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Copa 2026 - Dashboard</title>
    <style>
        :root { --primary: #8a1538; --secondary: #eeeee4; --accent: #007a5e; --fwc: #b8860b; --cc: #ffbc0d; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        
        .header { position: sticky; top: 0; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 1000; display: flex; justify-content: space-around; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 1.4em; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.8em; color: #666; text-transform: uppercase; }

        .btn-action { color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-reset { background: #ff4444; }
        .btn-save { background: var(--accent); }

        .group-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .team-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .team-name { font-weight: bold; color: var(--primary); border-bottom: 2px solid var(--secondary); margin-bottom: 10px; display: flex; justify-content: space-between; }
        
        .sticker-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 5px; }
        .sticker { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; font-size: 0.7em; transition: 0.1s; background: #fff; }
        .sticker.checked { background: var(--accent) !important; color: white; border-color: var(--accent); }
        
        .special-section { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .cc { border-top: 5px solid var(--cc); }
        .fwc { border-top: 5px solid var(--fwc); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="stat-item"><span class="stat-value" id="total">0/993</span><span class="stat-label">Total</span></div>
        <div class="stat-item"><span class="stat-value" id="percent">0%</span><span class="stat-label">Progresso</span></div>
        <button onclick="exportarNovoCodigo()" class="btn-action btn-save">Exportar Atualização</button>
        <button onclick="resetAlbum()" class="btn-action btn-reset">Limpar Tudo</button>
    </div>

    <div class="group-container" id="content"></div>
</div>

<script>
    const timesPorGrupo = {
        "GRUPO A": ["México (MEX)", "África do Sul (RSA)", "Coreia do Sul (KOR)", "Tchéquia (CZE)"],
        "GRUPO B": ["Canadá (CAN)", "Bósnia e Herz. (BIH)", "Catar (QAT)", "Suíça (SUI)"],
        "GRUPO C": ["Brasil (BRA)", "Marrocos (MAR)", "Haiti (HAI)", "Escócia (SCO)"],
        "GRUPO D": ["EUA (USA)", "Paraguai (PAR)", "Austrália (AUS)", "Turquia (TUR)"],
        "GRUPO E": ["Alemanha (GER)", "Curaçau (CUW)", "Costa do Marfim (CIV)", "Equador (ECU)"],
        "GRUPO F": ["Holanda (NED)", "Japão (JPN)", "Suécia (SWE)", "Tunísia (TUN)"],
        "GRUPO G": ["Bélgica (BEL)", "Egito (EGY)", "Irã (IRN)", "Nova Zelândia (NZL)"],
        "GRUPO H": ["Espanha (ESP)", "Cabo Verde (CPV)", "Arábia Saudita (KSA)", "Uruguai (URU)"],
        "GRUPO I": ["França (FRA)", "Senegal (SEN)", "Iraque (IRQ)", "Noruega (NOR)"],
        "GRUPO J": ["Argentina (ARG)", "Argélia (ALG)", "Áustria (AUT)", "Jordânia (JOR)"],
        "GRUPO K": ["Portugal (POR)", "RD Congo (COD)", "Uzbequistão (UZB)", "Colômbia (COL)"],
        "GRUPO L": ["Inglaterra (ENG)", "Croácia (CRO)", "Gana (GHA)", "Panamá (PAN)"]
    };

    // SEU BANCO DE DADOS FIXO ATUALIZADO
    let album = {
        "África do Sul (RSA)-4": true, "África do Sul (RSA)-7": true, "África do Sul (RSA)-8": true, "África do Sul (RSA)-11": true, "África do Sul (RSA)-16": true, "África do Sul (RSA)-17": true,
        "México (MEX)-2": true, "México (MEX)-4": true, "México (MEX)-8": true, "México (MEX)-10": true, "México (MEX)-12": true, "México (MEX)-17": true,
        "Tchéquia (CZE)-9": true, "Canadá (CAN)-4": true, "Canadá (CAN)-8": true, "Canadá (CAN)-12": true,
        "Catar (QAT)-2": true, "Catar (QAT)-6": true, "Catar (QAT)-10": true, "Catar (QAT)-19": true, "Catar (QAT)-14": true,
        "Brasil (BRA)-1": true, "Brasil (BRA)-9": true, "Brasil (BRA)-15": true, "Brasil (BRA)-19": true,
        "Marrocos (MAR)-12": true, "Marrocos (MAR)-14": true, "Marrocos (MAR)-15": true, "Marrocos (MAR)-17": true, "Marrocos (MAR)-19": true,
        "Escócia (SCO)-1": true, "Escócia (SCO)-2": true, "Escócia (SCO)-9": true, "Escócia (SCO)-10": true, "Escócia (SCO)-13": true, "Escócia (SCO)-15": true, "Escócia (SCO)-19": true,
        "EUA (USA)-3": true, "EUA (USA)-7": true, "EUA (USA)-11": true,
        "Paraguai (PAR)-13": true, "Paraguai (PAR)-14": true, "Paraguai (PAR)-17": true, "Paraguai (PAR)-18": true, "Paraguai (PAR)-19": true,
        "Austrália (AUS)-8": true, "Austrália (AUS)-12": true, "Alemanha (GER)-14": true,
        "Curaçau (CUW)-1": true, "Curaçau (CUW)-5": true, "Curaçau (CUW)-6": true, "Curaçau (CUW)-10": true, "Curaçau (CUW)-19": true,
        "Costa do Marfim (CIV)-19": true, "Equador (ECU)-3": true, "Equador (ECU)-4": true,
        "Holanda (NED)-2": true, "Holanda (NED)-6": true, "Holanda (NED)-10": true, "Holanda (NED)-15": true, "Holanda (NED)-19": true,
        "Japão (JPN)-4": true, "Japão (JPN)-9": true, "Japão (JPN)-14": true,
        "Bélgica (BEL)-3": true, "Bélgica (BEL)-7": true, "Bélgica (BEL)-11": true,
        "Irã (IRN)-2": true, "Irã (IRN)-6": true, "Irã (IRN)-8": true, "Irã (IRN)-10": true, "Irã (IRN)-12": true, "Irã (IRN)-15": true, "Irã (IRN)-17": true, "Irã (IRN)-19": true,
        "Nova Zelândia (NZL)-1": true, "Nova Zelândia (NZL)-2": true, "Nova Zelândia (NZL)-5": true, "Nova Zelândia (NZL)-10": true, "Nova Zelândia (NZL)-15": true, "Nova Zelândia (NZL)-19": true,
        "Espanha (ESP)-1": true, "Espanha (ESP)-5": true, "Espanha (ESP)-7": true,
        "Cabo Verde (CPV)-1": true, "Cabo Verde (CPV)-18": true, "Arábia Saudita (KSA)-4": true, "Arábia Saudita (KSA)-8": true,
        "Noruega (NOR)-3": true, "Noruega (NOR)-14": true, "Noruega (NOR)-18": true, "Argentina (ARG)-1": true, "Argélia (ALG)-17": true,
        "Áustria (AUT)-9": true, "Áustria (AUT)-14": true, "Áustria (AUT)-18": true, "Jordânia (JOR)-2": true,
        "Portugal (POR)-1": true, "Portugal (POR)-2": true, "Portugal (POR)-3": true, "Portugal (POR)-4": true, "Portugal (POR)-8": true, "Portugal (POR)-11": true, "Portugal (POR)-17": true,
        "Colômbia (COL)-4": true, "Colômbia (COL)-8": true, "Colômbia (COL)-12": true, "Colômbia (COL)-17": true,
        "Inglaterra (ENG)-1": true, "Inglaterra (ENG)-11": true, "Inglaterra (ENG)-16": true, "Inglaterra (ENG)-20": true,
        "Croácia (CRO)-3": true, "Croácia (CRO)-7": true, "Croácia (CRO)-11": true, "Tunísia (TUN)-11": true, "Tunísia (TUN)-16": true
    };

    function render() {
        const container = document.getElementById('content');
        container.innerHTML = '';
        let count = 0;

        Object.keys(timesPorGrupo).forEach(grupo => {
            timesPorGrupo[grupo].forEach(time => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `<div class="team-name"><span>${time}</span><small style="color:#999">${grupo}</small></div>`;
                
                const grid = document.createElement('div');
                grid.className = 'sticker-grid';
                
                for(let i=1; i<=20; i++) {
                    const id = `${time}-${i}`;
                    const div = document.createElement('div');
                    div.className = `sticker ${album[id] ? 'checked' : ''}`;
                    div.innerText = i;
                    div.onclick = () => toggle(id);
                    if(album[id]) count++;
                    grid.appendChild(div);
                }
                card.appendChild(grid);
                container.appendChild(card);
            });
        });

        count += renderSpecials(container, "Coca Cola", "CC", 14, "cc");
        count += renderSpecials(container, "FIFA World Cup", "FWC", 19, "fwc");

        const totalGeral = 993;
        document.getElementById('total').innerText = `${count}/${totalGeral}`;
        document.getElementById('percent').innerText = Math.round((count/totalGeral)*100) + '%';
    }

    function renderSpecials(container, nome, prefixo, qtd, classe) {
        let checkedInSpecial = 0;
        const card = document.createElement('div');
        card.className = `team-card ${classe}`;
        card.innerHTML = `<div class="team-name">${nome}</div>`;
        const grid = document.createElement('div');
        grid.className = 'sticker-grid';
        for(let i=1; i<=qtd; i++) {
            const id = `${prefixo}-${i}`;
            const div = document.createElement('div');
            div.className = `sticker ${album[id] ? 'checked' : ''}`;
            div.innerText = i;
            div.onclick = () => toggle(id);
            if(album[id]) checkedInSpecial++;
            grid.appendChild(div);
        }
        card.appendChild(grid);
        container.appendChild(card);
        return checkedInSpecial;
    }

    function toggle(id) {
        album[id] = !album[id];
        render();
    }

    function resetAlbum() {
        if(confirm("Deseja zerar sua coleção?")) {
            album = {};
            render();
        }
    }

    // GERA O CÓDIGO FONTE PRONTO PARA VOCÊ COLAR NO GITHUB
    function exportarNovoCodigo() {
        const stringDeDados = JSON.stringify(album, null, 4);
        
        // Localiza todo o script atual da página para remontar o arquivo completo
        const htmlCompleto = document.documentElement.outerHTML;
        
        // Cria um arquivo de download automático com o index.html atualizado
        const blob = new Blob([htmlCompleto], {type: "text/html"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "index.html";
        link.click();
        
        alert("O seu novo arquivo 'index.html' atualizado foi baixado! Agora basta arrastá-lo para dentro do seu repositório no GitHub para atualizar o site.");
    }

    render();
</script>
</body>
</html>
