<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Copa 2026 - Nuvem Dashboard</title>
    <style>
        :root { --primary: #8a1538; --secondary: #eeeee4; --accent: #007a5e; --fwc: #b8860b; --cc: #ffbc0d; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        
        .header { position: sticky; top: 0; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 1000; display: flex; justify-content: space-around; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 1.4em; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.8em; color: #666; text-transform: uppercase; }

        .backup-area { width: 100%; background: #eee; padding: 10px; border-radius: 5px; display: flex; gap: 10px; margin-top: 10px; }
        .backup-area input { flex: 1; padding: 5px; border: 1px solid #ddd; border-radius: 3px; }

        .group-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .team-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .team-name { font-weight: bold; color: var(--primary); border-bottom: 2px solid var(--secondary); margin-bottom: 10px; display: flex; justify-content: space-between; }
        
        .sticker-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 5px; }
        .sticker { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; font-size: 0.7em; transition: 0.1s; }
        .sticker.checked { background: var(--accent) !important; color: white; border-color: var(--accent); }
        
        .special-section { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .cc { border-top: 5px solid var(--cc); }
        .fwc { border-top: 5px solid var(--fwc); }
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="stat-item"><span class="stat-value" id="total">0/993</span><span class="stat-label">Total</span></div>
        <div class="stat-item"><span class="stat-value" id="percent">0%</span><span class="stat-label">Progresso</span></div>
        <button onclick="resetAlbum()" style="background:#ff4444; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">Limpar Tudo</button>
        
        <div class="backup-area">
            <input type="text" id="backup-input" placeholder="Cole aqui o texto do seu bloco de notas">
            <button onclick="importBackup()" style="background:var(--accent); color:white; border:none; padding:5px 15px; border-radius:3px; cursor:pointer; font-weight:bold;">Importar Backup Corrigido</button>
        </div>
    </div>

    <div class="group-container" id="content"></div>
</div>

<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // Configurações do Firebase (MANTENHA SUAS ASPAS DUPLAS!)
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_AUTH_DOMAIN",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_STORAGE_BUCKET",
        messagingSenderId: "SEU_MESSAGING_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection("album").doc("colecao");

    const timesPorGrupo = {
        "GRUPO A": ["México (MEX)", "África do Sul (RSA)", "Coreia do Sul (KOR)", "Tchéquia (CZE)"],
        "GRUPO B": ["Canadá (CAN)", "Bósnia e Herz. (BIH)", "Catar (QAT)", "Suíça (SUI)"],
        "GRUPO C": ["Brasil (BRA)", "Marrocos (MAR)", "Haiti (HAI)", "Escócia (SCO)"],
        "GRUPO D": ["EUA (USA)", "Paraguai (PAR)", "Austrália (AUS)", "Turquia (TUR)"],
        "GRUPO E": ["Alemanha (GER)", "Curaçau (CUW)", "Costa do Marfim (CIV)", "Equador (ECU)"],
        "GRUPO F": ["Holanda (NED)", "Japão (JPN)", "Suécia (SWE)", "Tunísia (TUN)"],
        "GRUPO G": ["Bélgica (BEL)", "Egito (EGY)", "Irã (IRN)", "Nova Zelândia (NZL)"],
        "GRUPO H": ["Espanha (ESP)", "Cabo Verde (CPV)", "Arábia Saudita (KSA)", "Uruguai (URU)"],
        "GRUPO I": ["França (FRA)", "Senegal (SEN)", "Iraque (IRQ)", "Noruega (NOR)"],
        "GRUPO J": ["Argentina (ARG)", "Argélia (ALG)", "Áustria (AUT)", "Jordânia (JOR)"],
        "GRUPO K": ["Portugal (POR)", "RD Congo (COD)", "Uzbequistão (UZB)", "Colômbia (COL)"],
        "GRUPO L": ["Inglaterra (ENG)", "Croácia (CRO)", "Gana (GHA)", "Panamá (PAN)"]
    };

    let album = {};

    function render() {
        const container = document.getElementById('content');
        container.innerHTML = '';
        let count = 0;

        Object.keys(timesPorGrupo).forEach(grupo => {
            timesPorGrupo[grupo].forEach(time => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `<div class="team-name"><span>${time}</span><small style="color:#999">${grupo}</small></div>`;
                
                const grid = document.createElement('div');
                grid.className = 'sticker-grid';
                
                for(let i=1; i<=20; i++) {
                    const id = `${time}-${i}`;
                    const div = document.createElement('div');
                    div.className = `sticker ${album[id] ? 'checked' : ''}`;
                    div.innerText = i;
                    div.onclick = () => toggle(id);
                    if(album[id]) count++;
                    grid.appendChild(div);
                }
                card.appendChild(grid);
                container.appendChild(card);
            });
        });

        count += renderSpecials(container, "Coca Cola", "CC", 14, "cc");
        count += renderSpecials(container, "FIFA World Cup", "FWC", 19, "fwc");

        const totalGeral = 993;
        document.getElementById('total').innerText = `${count}/${totalGeral}`;
        document.getElementById('percent').innerText = Math.round((count/totalGeral)*100) + '%';
    }

    function renderSpecials(container, nome, prefixo, qtd, classe) {
        let checkedInSpecial = 0;
        const card = document.createElement('div');
        card.className = `team-card ${classe}`;
        card.innerHTML = `<div class="team-name">${nome}</div>`;
        const grid = document.createElement('div');
        grid.className = 'sticker-grid';
        for(let i=1; i<=qtd; i++) {
            const id = `${prefixo}-${i}`;
            const div = document.createElement('div');
            div.className = `sticker ${album[id] ? 'checked' : ''}`;
            div.innerText = i;
            div.onclick = () => toggle(id);
            if(album[id]) checkedInSpecial++;
            grid.appendChild(div);
        }
        card.appendChild(grid);
        container.appendChild(card);
        return checkedInSpecial;
    }

    function toggle(id) {
        document.getElementById('content').classList.add('loading');
        album[id] = !album[id];
        docRef.set(album).then(() => {
            document.getElementById('content').classList.remove('loading');
            render();
        }).catch(err => console.error("Erro ao salvar:", err));
    }

    function resetAlbum() {
        if(confirm("Deseja zerar sua coleção na nuvem?")) {
            album = {};
            docRef.set(album).then(() => render());
        }
    }

    // NOVA FUNÇÃO ATUALIZADA: Decodifica especificamente a estrutura do seu log do console
    function importBackup() {
        const rawText = document.getElementById('backup-input').value.trim();
        if(!rawText) return alert("Cole o texto do backup primeiro!");

        try {
            const parsedArray = JSON.parse(rawText);
            
            // Localiza o par chave/valor correspondente ao 'album2026_v2' no seu array bidimensional
            const parAlbum = parsedArray.find(item => Array.isArray(item) && item[0] === "album2026_v2");
            
            if (!parAlbum || !parAlbum[1]) {
                return alert("Não encontramos a chave 'album2026_v2' no texto colado.");
            }

            // Transforma o texto interno JSON em um objeto real de figurinhas
            const dadosBrutosStickers = JSON.parse(parAlbum[1]);
            let finalAlbum = {};

            // Filtra os dados: remove chaves inválidas antigas e mantém apenas chaves oficiais com "true"
            Object.keys(dadosBrutosStickers).forEach(key => {
                if(dadosBrutosStickers[key] === true) {
                    // Mantém apenas os registros que contêm parênteses (formato novo corrigido) ou especiais
                    if(key.includes('(') || key.startsWith('CC-') || key.startsWith('FWC-')) {
                        finalAlbum[key] = true;
                    }
                }
            });

            // Grava os dados tratados diretamente na nuvem do Firebase
            docRef.set(finalAlbum).then(() => {
                alert("Backup decodificado e enviado com sucesso para a nuvem!");
                document.getElementById('backup-input').value = '';
            }).catch(err => alert("Erro ao sincronizar com o banco de dados."));

        } catch (e) {
            alert("Erro na leitura do formato. Garanta que copiou a mensagem de texto completa.");
        }
    }

    // Escuta ativa do Firebase
    docRef.onSnapshot((doc) => {
        if (doc.exists) {
            album = doc.data();
        } else {
            album = {};
        }
        render();
    });
</script>
</body>
</html>
