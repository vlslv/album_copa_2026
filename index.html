<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Álbum Copa 2026</title>
    <style>
        :root { --primary: #007a5e; --secondary: #f4c430; --bg: #f4f4f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { text-align: center; color: var(--primary); }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h3 { margin: 0; color: #555; }
        .card p { font-size: 2em; font-weight: bold; margin: 10px 0; color: var(--primary); }
        
        .filters { text-align: center; margin-bottom: 20px; }
        select, button { padding: 10px; font-size: 1em; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
        .sticker { background: white; border: 2px solid #ddd; padding: 10px; text-align: center; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .sticker.filled { background-color: #d4edda; border-color: #c3e6cb; color: var(--primary); font-weight: bold; }
        .sticker:hover { transform: scale(1.05); }
        
        .mcdonalds { border-color: #ff0000; }
        .legend { border-color: #b8860b; background-color: #fffacd; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Meu Álbum - Copa 2026 🏆</h1>
    
    <div class="dashboard">
        <div class="card"><h3>Total</h3><p id="totalCount">0/980</p></div>
        <div class="card"><h3>Faltando</h3><p id="missingCount">980</p></div>
        <div class="card"><h3>%</h3><p id="percentCount">0%</p></div>
    </div>

    <div class="filters">
        <select id="sectionSelect" onchange="renderStickers()">
            <option value="all">Todas as Figurinhas</option>
            <option value="teams">Seleções (48 times)</option>
            <option value="mcdonalds">McDonald's</option>
            <option value="legends">Legends</option>
        </select>
        <button onclick="resetAlbum()">Resetar</button>
    </div>

    <div class="grid" id="stickerGrid"></div>
</div>

<script>
    const TOTAL_STICKERS = 980;
    let stickers = JSON.parse(localStorage.getItem('copa2026_stickers')) || {};

    function save() {
        localStorage.setItem('copa2026_stickers', JSON.stringify(stickers));
        updateDashboard();
    }

    function toggleSticker(id) {
        stickers[id] = !stickers[id];
        save();
        renderStickers();
    }

    function updateDashboard() {
        const filled = Object.values(stickers).filter(v => v).length;
        document.getElementById('totalCount').innerText = `${filled}/${TOTAL_STICKERS}`;
        document.getElementById('missingCount').innerText = TOTAL_STICKERS - filled;
        document.getElementById('percentCount').innerText = Math.round((filled / TOTAL_STICKERS) * 100) + '%';
    }

    function resetAlbum() {
        if(confirm("Tem certeza que deseja apagar todo o álbum?")) {
            stickers = {};
            save();
            renderStickers();
        }
    }

    function renderStickers() {
        const grid = document.getElementById('stickerGrid');
        grid.innerHTML = '';
        const filter = document.getElementById('sectionSelect').value;
        
        for (let i = 1; i <= TOTAL_STICKERS; i++) {
            // Lógica simples de divisão (ajustar conforme manual real)
            if(filter === 'mcdonalds' && (i < 900 || i > 950)) continue; 
            if(filter === 'legends' && (i < 951 || i > 980)) continue;

            const div = document.createElement('div');
            div.className = `sticker ${stickers[i] ? 'filled' : ''}`;
            if(i > 950) div.classList.add('legend');
            else if(i > 900) div.classList.add('mcdonalds');
            
            div.innerText = i;
            div.onclick = () => toggleSticker(i);
            grid.appendChild(div);
        }
    }

    updateDashboard();
    renderStickers();
</script>
</body>
</html>
